<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="vt-version" content="3.0.0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Victor Trail">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Victor · De Paris au sommet</title>
<meta name="description" content="Consultant le jour, traileur entre midi et deux : ma prépa en direct jusqu'aux 180 km de la Diagonale des Fous 2027.">
<meta property="og:title" content="Victor · De Paris au sommet">
<meta property="og:description" content="Objectif Diagonale des Fous 2027 : la prépa d'un amateur, en direct.">
<meta property="og:image" content="img/og.png">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--bg:#F1F0EC;--paper:#FFFFFF;--ink:#14171C;--ink2:#3F444B;--muted:#6B7078;--line:#E1DED7;--soft:#E9E7E1;--blaze:#C0392B;--gold:#A58D4E;--gold2:#C9B37E;--good:#2F7D5B;--bad:#B0443B;--night:#14171C;--f:'Manrope',system-ui,sans-serif;--kr:'Noto Sans KR',sans-serif;
  --z1:#5B8DB8;--z2:#2F7D5B;--z3:#C9A227;--z4:#D9752B;--z5:#B0443B;--gym:#6B7078;--r:14px;--tab:64px}
@media (prefers-color-scheme:dark){:root{--bg:#0F1216;--paper:#181C22;--ink:#EDEDED;--ink2:#C5C8CD;--muted:#9AA0A8;--line:#2A2F37;--soft:#20252C;--gold:#C9B37E;--good:#5DBB8E;--bad:#E07A70}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}button{font:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* barre du haut */
.bar{position:sticky;top:0;z-index:30;background:var(--night);color:#EDEDED;padding-top:env(safe-area-inset-top)}
.bar .in{max-width:680px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:300;letter-spacing:.3em;font-size:.86rem}
.brand svg{width:64px;height:22px}
.cd{font:600 .8rem var(--f);color:var(--gold2);text-decoration:none;white-space:nowrap}
.cd b{font-weight:800;color:#fff;font-size:.95rem}
.livepill{display:none;background:var(--blaze);color:#fff;text-decoration:none;font:700 .86rem var(--f);padding:10px 16px;align-items:center;justify-content:center;gap:10px}
.livepill.on{display:flex}
.livepill i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.livepill i{animation:none}}
/* écrans */
main{max-width:680px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) calc(var(--tab) + 28px + env(safe-area-inset-bottom))}
.scr{display:none}.scr.on{display:block}
h1{font:800 1.7rem/1.1 var(--f);letter-spacing:-.015em;margin:0}
h2{font:800 1.15rem/1.2 var(--f);margin:0}
.hd{margin:4px 0 16px}.hd p{margin:6px 0 0;color:var(--ink2);font-size:.95rem}
.sub{font:700 .82rem var(--f);color:var(--muted);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sub a,.sub button{font-weight:700;color:var(--gold);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0;line-height:1.5}
/* bande de la semaine */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:64px;-webkit-tap-highlight-color:transparent}
.strip .d{font:600 .7rem var(--f);color:var(--muted)}
.strip .n{font:800 1.05rem var(--f)}
.strip .dots{display:flex;gap:3px;height:7px}
.strip .dots i{width:7px;height:7px;border-radius:50%}
.strip button.today .n{color:var(--blaze)}
.strip button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button[aria-pressed=true] .d{color:inherit;opacity:.7}
.strip button[aria-pressed=true].today .n{color:var(--gold2)}
/* carte séance */
.sess{display:grid;gap:10px}
.sc{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--zc,var(--gym));border-radius:var(--r);padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sc .goal{font:600 .8rem var(--f);color:var(--muted)}
.sc h3{font:800 1.15rem/1.25 var(--f);margin:2px 0 0}
.sc .tags{display:flex;gap:6px;flex-shrink:0}
.tag{font:700 .72rem var(--f);padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.k{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.tag.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.nums{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.nums div{display:flex;flex-direction:column}
.nums b{font:800 1.35rem/1.1 var(--f);font-variant-numeric:tabular-nums}
.nums span{font-size:.74rem;color:var(--muted)}
.sc .more{display:block;margin-top:10px;font:700 .82rem var(--f);color:var(--gold)}
.rest{border:1px dashed var(--line);border-radius:var(--r);padding:20px 16px;text-align:center;color:var(--ink2)}
.rest b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:2px}
.did{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--good) 12%,var(--paper));border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
/* jauges de la semaine */
.gauges{display:grid;gap:12px}
.ga .l{display:flex;justify-content:space-between;font-size:.88rem}
.ga .l b{font-variant-numeric:tabular-nums}
.ga .t{height:8px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.ga .t i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.race1{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none}
.race1 .j{font:800 1.5rem var(--f);font-variant-numeric:tabular-nums;white-space:nowrap}
.race1 .j small{font-size:.8rem;font-weight:600;color:var(--muted);margin-right:2px}
/* séances : navigation par semaine */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.2rem}
.wnav button:disabled{opacity:.3;cursor:default}
.wnav .c{text-align:center;flex:1}
.wnav .c b{display:block;font:800 1.05rem var(--f)}
.wnav .c span{font-size:.82rem;color:var(--muted)}
.wsum{display:flex;justify-content:center;gap:16px;margin:12px 0 4px;font-size:.88rem;color:var(--ink2)}
.wsum b{font-variant-numeric:tabular-nums;color:var(--ink)}
.phase{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.phase::-webkit-scrollbar{display:none}
.phase button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 12px 7px 9px;font:600 .8rem var(--f);display:flex;gap:7px;align-items:center;cursor:pointer}
.phase button i{width:9px;height:9px;border-radius:50%}
.phase button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;gap:2px;margin-top:8px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dl{font:700 .82rem var(--f);color:var(--muted);padding-top:12px}
.day .dl b{display:block;font-size:1.05rem;color:var(--ink)}
.day.today .dl b{color:var(--blaze)}
.day .sess .sc{padding:11px 14px}
.day .sess .sc h3{font-size:1rem}
.day .sess .nums{margin-top:6px;gap:14px}.day .sess .nums b{font-size:1rem}
.day .none{padding-top:12px;color:var(--muted);font-size:.9rem}
.wknote{font-size:.88rem;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:12px}
/* fiche séance */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:680px;max-height:92vh;border-radius:20px 20px 0 0;background:var(--paper);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(8,10,12,.55)}
@media (min-width:760px){dialog.sheet{margin:auto;border-radius:20px;max-height:86vh}}
.sh-h{position:sticky;top:0;background:var(--paper);padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:1}
.sh-h .x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:1rem;flex-shrink:0}
.sh-b{padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.sh-b .ds{color:var(--ink2);margin:12px 0 0}
.zbig{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--zc) 12%,var(--paper))}
.zbig b{font:800 1.5rem var(--f);color:var(--zc);font-variant-numeric:tabular-nums}
.zbig span{font-size:.85rem;color:var(--ink2)}
.steps,.exs{list-style:none;margin:14px 0 0;padding:0}
.steps li,.exs li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.steps li b,.exs li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.steps li small{grid-column:2;color:var(--muted);font-size:.8rem}
.zc{display:inline-block;font:700 .66rem var(--f);padding:1px 6px;border-radius:4px;color:#fff;margin-left:6px;vertical-align:1px}
.exs li{grid-template-columns:1fr auto}
/* assistance */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font:700 .86rem var(--f);cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.where{background:var(--night);color:#EDEDED;border-radius:var(--r);padding:18px;margin-top:14px}
.where .k{font:600 .82rem var(--f);color:#9AA0A8}
.where .nm{font:800 1.55rem/1.15 var(--f);margin:4px 0 2px;color:#fff}
.where .eta{font:800 2.6rem/1 var(--f);color:var(--gold2);font-variant-numeric:tabular-nums;margin-top:12px}
.where .win{font-size:.9rem;color:#C5C8CD;margin-top:6px}
.where .risk{color:#F28B82;font-weight:700}
.where .give{margin-top:16px;border-top:1px solid #2A2F37;padding-top:12px}
.where .give ul{margin:6px 0 0;padding-left:18px}
.where .give li{margin:3px 0}
.where .stop{display:inline-block;margin-top:10px;font:700 .8rem var(--f);background:#2A2F37;color:var(--gold2);padding:5px 10px;border-radius:99px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font:800 .98rem var(--f);text-decoration:none;cursor:pointer;margin-top:12px}
.btn.red{background:var(--blaze);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.where .btn.ghost{color:#EDEDED;border-color:#3A404A}
.form2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:10px}
.form2 label{display:flex;flex-direction:column;gap:4px;font:600 .8rem var(--f);color:var(--muted)}
.form2 select,.form2 input{font:600 1rem var(--f);padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:46px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pts{display:grid;gap:0;margin-top:4px}
.pt{border-top:1px solid var(--line)}
.pt summary{list-style:none;display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:12px 0;cursor:pointer;align-items:center}
.pt summary::-webkit-details-marker{display:none}
.pt .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);justify-self:center}
.pt.done .dot{background:var(--good);border-color:var(--good)}
.pt.next .dot{background:var(--blaze);border-color:var(--blaze);box-shadow:0 0 0 4px color-mix(in srgb,var(--blaze) 25%,transparent)}
.pt .a{font-weight:700}.pt .a small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.pt .b{text-align:right;font:800 1rem var(--f);font-variant-numeric:tabular-nums;white-space:nowrap}.pt .b small{display:block;font:500 .74rem var(--f);color:var(--muted)}
.pt.done .a,.pt.done .b{color:var(--muted)}
.pt .body{padding:0 0 14px 32px;font-size:.9rem;color:var(--ink2)}
.pt .body ul{margin:4px 0;padding-left:18px}
.pt.bv .a::after{content:'base vie';margin-left:8px;font:700 .66rem var(--f);padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold);vertical-align:2px}
.pt .noas{color:var(--muted)}
.crew{margin-top:4px}.crew summary{cursor:pointer;font-weight:700;padding:4px 0}
.crew ul{margin:8px 0 0;padding-left:18px;color:var(--ink2)}.crew li{margin:5px 0}
/* progrès */
.tw-hero{display:flex;gap:14px;align-items:center;background:var(--night);color:#EDEDED;border-radius:var(--r);padding:16px 18px;margin-top:14px}
.tw-hero b{white-space:nowrap;font:800 2.4rem/1 var(--f);color:var(--gold2);font-variant-numeric:tabular-nums}
.tw-hero span{font-size:.9rem;line-height:1.4}
.tw-hero small{display:block;color:#9AA0A8;font-size:.78rem;margin-top:4px}
.tw-prof{margin-top:12px;padding:10px 10px 6px}
.tw-prof svg{width:100%;height:auto;display:block}
.tw-prof text{font:600 10px var(--f);fill:var(--muted)}
.tw-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:6px}
.tw-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw-list{display:grid;gap:8px}
.tw-c{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:var(--r)}
.tw-c summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;align-items:center}
.tw-c summary::-webkit-details-marker{display:none}
.tw-c .k{font:700 .76rem var(--f);color:var(--muted)}
.tw-c h3{font:800 1rem/1.3 var(--f);margin:2px 0 0}
.tw-c .p{font:800 1.2rem var(--f);color:var(--tc);font-variant-numeric:tabular-nums;text-align:right}
.tw-c .p small{display:block;font:600 .68rem var(--f);color:var(--muted)}
.tw-c .body{padding:0 14px 14px;font-size:.9rem;color:var(--ink2)}
.tw-ov{width:100%;height:auto;display:block;background:var(--soft);border-radius:10px;margin:2px 0 8px}
.tw-ov text{font:600 10px var(--f);fill:var(--muted)}
.tw-alt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tw-alt button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 11px;font:700 .78rem var(--f);color:var(--ink2);cursor:pointer;min-height:34px}
.tw-alt button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tw-act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.tw-act .btn{min-height:44px;font-size:.84rem}
.tw-map{height:240px;border-radius:12px;margin-top:10px;isolation:isolate;z-index:0;position:relative}
.tw-rv{display:inline-block;font:700 .7rem var(--f);padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--blaze) 15%,transparent);color:var(--blaze);margin-left:4px}
.tabs.crew a:not([data-t="assistance"]){display:none}.tabs.crew .in{grid-template-columns:1fr}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
#lock .card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px}
#lock h1{font:800 1.5rem/1.2 var(--f);margin:0 0 6px}#lock p{color:var(--muted);margin:0 0 16px;font-size:.92rem;line-height:1.45}
#lock label{display:block;font:700 .8rem var(--f);margin:0 0 6px}#lock input{width:100%;box-sizing:border-box;font:600 1.05rem var(--f);padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:12px}
#lock input#lkCode{font-size:.95rem}#lock .btn{width:100%;min-height:48px}#lock .err{color:var(--blaze);font-weight:700;font-size:.86rem;min-height:1.2em;margin:4px 0 0}
#lock .small{font-size:.8rem;margin:16px 0 0}
.vers .ver{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.vers .ver.cur{border-color:var(--ink)}
.vers .vh{display:flex;gap:12px;align-items:center;margin-bottom:8px}.vers .vh small{display:block;color:var(--muted);font-size:.82rem;font-weight:500}
.vers .vn{flex:none;min-width:46px;text-align:center;padding:5px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font:800 .86rem var(--f)}
.vers .ver:not(.cur) .vn{background:transparent;color:var(--ink);border:1px solid var(--line)}
.vers ul{margin:0;padding-left:20px}.vers li{margin:5px 0;line-height:1.4}
ul.whatsnew{padding-left:20px;margin:6px 0 0}ul.whatsnew li{margin:7px 0;line-height:1.4}
#upd{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 12px 12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#upd small{display:block;opacity:.75;font-size:.8rem}#upd button{flex:none;border:0;border-radius:10px;padding:10px 14px;background:var(--bg);color:var(--ink);font:800 .9rem var(--f)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font:600 .8rem var(--f);color:var(--muted)}
.kpi .v{font:800 1.6rem/1.1 var(--f);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .dl{font:700 .76rem var(--f)}
.kpi svg{width:100%;height:36px;display:block;margin-top:8px}
.ixbar{height:10px;border-radius:99px;background:var(--soft);margin:12px 0 6px;overflow:hidden}.ixbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.ixl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}.ixl b{color:var(--ink)}
.steps3{display:grid;gap:8px;margin-top:12px}
.steps3 div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.9rem}
.steps3 b{font-variant-numeric:tabular-nums}
.vol svg{width:100%;height:auto;display:block}.vol text{font:600 10px var(--f);fill:var(--muted)}
/* plus */
.menu{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;text-decoration:none;border-top:1px solid var(--line)}
.menu a:first-child{border-top:0}
.menu a span{font-weight:700}.menu a small{display:block;font-weight:500;color:var(--muted);font-size:.84rem}
.menu a::after{content:'›';font-size:1.4rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font:700 .9rem var(--f);color:var(--gold);text-decoration:none;margin-bottom:10px;min-height:36px}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stg .box b{display:block;font:800 1.3rem var(--f);font-variant-numeric:tabular-nums;margin-top:2px}
.stg .box span{font-size:.8rem;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.list li:first-child{border-top:0}
.list li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cues{margin:8px 0 0;padding-left:20px}.cues li{margin:5px 0}
.tmrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.tmrow .b{font:800 1rem var(--f);font-variant-numeric:tabular-nums;text-align:right}
.tmrow small{color:var(--muted);font-size:.8rem}.tmrow small:last-child{text-align:right}
.tmrow .f{grid-column:1/-1;font-size:.82rem;color:var(--ink2)}
.tmrow.bv .a::after{content:'base vie';margin-left:8px;font:700 .66rem var(--f);padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.rc{border-radius:var(--r);overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.rc .band{background:var(--blaze);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;font:700 .84rem var(--f)}
.rc.A .band{background:var(--night);color:var(--gold2)}
.rc .in{padding:14px 16px}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acts li{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.acts .dt{text-align:center;line-height:1.1}.acts .dt b{display:block;font-size:1.2rem}.acts .dt span{font-size:.72rem;color:var(--muted)}
.acts .st{text-align:right;font-size:.86rem;color:var(--ink2)}
.about .line svg{width:100%;height:auto}
.about .line .base{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.about .line .tower{fill:none;stroke:var(--muted);stroke-width:3}
.about .line .done{fill:none;stroke:var(--blaze);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.about .line .goal{fill:var(--gold2)}.about .line .dot{fill:var(--blaze);stroke:var(--paper);stroke-width:3}
.kr{font-family:var(--kr)}
/* réalisé, météo */
.res{margin-top:10px;font-size:.84rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.res .v{font:800 .74rem var(--f);padding:3px 8px;border-radius:99px}
.res .v.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.res .v.warn{background:color-mix(in srgb,var(--z4) 20%,transparent);color:var(--z4)}
.wx{display:block;margin-top:8px;font-size:.82rem;color:var(--muted)}
.wx:empty{display:none}
.did2{margin-top:14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--good) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--good) 28%,transparent)}
.did2.warn{background:color-mix(in srgb,var(--z4) 10%,var(--paper));border-color:color-mix(in srgb,var(--z4) 30%,transparent)}
.did2 b{display:block;margin-bottom:2px}
/* mode salle */
dialog.gm{border:0;padding:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;background:var(--bg);color:var(--ink)}
dialog.gm::backdrop{background:var(--bg)}
.gm .in{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.gm .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gm .top .x{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:1rem;cursor:pointer}
.gm .prog{display:flex;gap:4px;margin:10px 0 12px}.gm .prog i{flex:1;height:5px;border-radius:99px;background:var(--soft)}.gm .prog i.on{background:var(--ink)}.gm .prog i.dn{background:var(--good)}
.gm canvas{width:100%;height:auto;aspect-ratio:17/12;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.gm .ph{font-size:.84rem;color:var(--muted);text-align:center;min-height:1.3em;margin-top:6px}
.gm h2{font-size:1.35rem;margin-top:8px}
.gm .sr{font:800 2rem/1.1 var(--f);font-variant-numeric:tabular-nums;margin-top:4px}
.gm .cues{color:var(--ink2);font-size:.92rem}
.gm .sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gm .sets button{min-width:58px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font:800 1rem var(--f);cursor:pointer}
.gm .sets button[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.gm .timer{margin-top:14px;background:var(--night);color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gm .timer b{font:800 2.2rem var(--f);font-variant-numeric:tabular-nums}
.gm .timer button{border:0;border-radius:10px;background:#2A2F37;color:#fff;min-width:48px;min-height:44px;font:700 .9rem var(--f);cursor:pointer}
.gm .timer.go{background:var(--blaze)}
.gm .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:16px}
/* carte */
.map{position:relative;z-index:0;isolation:isolate;height:340px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-top:12px;background:var(--soft)}
.map .leaflet-control-attribution{font-size:9px}
.me-ic{width:22px;height:22px;border-radius:50%;background:var(--blaze);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--blaze) 30%,transparent)}
.maplg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.maplg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.crw{display:grid;gap:10px}
.crw .box b{font-size:1.02rem}
.crw .eta2{font:800 1.3rem var(--f);font-variant-numeric:tabular-nums}
.crw .go2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.crw .go2 a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font:700 .9rem var(--f)}
.crw .drv{margin-top:8px;font-size:.88rem}
.crw .drv .ok{color:var(--good);font-weight:700}.crw .drv .ko{color:var(--bad);font-weight:700}
.prof{position:relative;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 4px;touch-action:pan-y}
.prof svg{display:block;width:100%;height:auto}.prof text{font:600 10px var(--f);fill:var(--muted)}.prof .lb{fill:var(--ink);font-weight:700}
.prof .tip{position:absolute;top:6px;pointer-events:none;background:var(--night);color:#fff;border-radius:8px;padding:6px 9px;font:600 .76rem var(--f);white-space:nowrap;display:none;z-index:2}
.prof .tip b{color:var(--gold2)}
.prof{touch-action:pan-y}.prof .pv{touch-action:pan-y}
.pz{display:flex;gap:6px;justify-content:flex-end;margin:6px 4px 0}.pz button{min-width:40px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:700 .86rem var(--f);cursor:pointer;padding:0 10px}.pz button:disabled{opacity:.35}
.psum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin:8px 4px 0;font-size:.84rem;color:var(--ink2);font-variant-numeric:tabular-nums}.psum b{color:var(--ink)}
.slg{display:flex;gap:10px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin:6px 4px 2px}.slg i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:2px}
.mdl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.9rem;color:var(--ink2)}.mdl b{color:var(--ink)}
/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--night) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#9AA0A8;font:700 .66rem var(--f);-webkit-tap-highlight-color:transparent;position:relative}
.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:#fff}
.tabs a.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#fff 50%,var(--blaze) 50%)}
@media (min-width:760px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

function sessCard(s,big){const zc=zcol(s);const n=['<div><b>'+hm(s.m)+'</b><span>durée</span></div>'];
  if(s.km)n.push('<div><b>'+km(s.km)+'</b><span>km env.</span></div>');if(s.dp)n.push('<div><b>'+fr(s.dp)+'</b><span>m D+</span></div>');
  if(big&&s.zt)n.push('<div><b style="color:'+zc+'">'+esc(s.zt.replace(/^Z\d\s*/,''))+'</b><span>zone '+esc(s.z[1])+'</span></div>');
  const tags=(s.co?'<span class="tag" title="Programmée par Dorian (Nolio)">Coach</span>':'')+(OWNER&&s.cp&&!s.co&&!s.r?'<span class="tag" title="Sur ta Coros">⌚</span>':'')+(s.done||s.r?'<span class="tag ok">✓ Faite</span>':'')+(s.k?'<span class="tag k">Clé</span>':'')+(s.sl?'<span class="tag">'+(s.sl==='m'?'Midi':'Soir')+'</span>':'');
  const date=add(s._ws,s.d);
  return '<button class="sc" style="--zc:'+zc+'" data-s="'+s._ws+'|'+s._i+'"><div class="top"><div><div class="goal">'+esc(s.g)+'</div><h3>'+esc(s.t)+'</h3></div><div class="tags">'+tags+'</div></div><div class="nums">'+n.join('')+'</div>'+resLine(s)+(s.c!=='gym'&&!s.r?'<span class="wx" data-wx="'+date+'|'+(s.sl||'')+'|'+s.m+'"></span>':'')+(big?'<span class="more">'+(s.gk?'Voir les exercices et démarrer':s.wo?'Voir le détail de la séance':'Voir la séance')+'</span>':'')+'</button>'}
const VWARN={fast:1,short:1,long:1};
function resLine(s){const r=s.r;if(!r)return '';const bits=[hm(r.min)];if(r.km)bits.push(km(r.km)+' km');if(r.dp)bits.push(fr(r.dp)+' m');if(r.inz!=null)bits.push(r.inz+' % en '+r.zl);
  return '<div class="res"><span class="v '+(VWARN[r.v]?'warn':'ok')+'">'+esc(r.vt)+'</span><span>'+bits.join(' · ')+'</span></div>'}
function resText(s){const r=s.r;if(!r)return '';const pl=s.m;let t='';
  if(r.v==='short')t='Faite en '+hm(r.min)+' au lieu de '+hm(pl)+'.';else if(r.v==='long')t='Faite en '+hm(r.min)+', plus longue que les '+hm(pl)+' prévues.';
  else if(r.v==='fast')t=r.above+' % du temps au-dessus de la '+r.zl+' : à ralentir la prochaine fois, l\'endurance se construit en zone basse.';
  else t=s.c==='gym'?'Séance de renfo enregistrée par la montre.':'Durée respectée'+(r.inz!=null?', '+r.inz+' % du temps en '+r.zl:'')+'.';
  return t}
const dlg=document.getElementById('sheet');let lastFocus=null;
function openSess(ws,i,trigger){const w=PL.find(x=>x.ws===ws);if(!w)return;const s=w.s[i];if(!s)return;const date=add(ws,s.d);lastFocus=trigger||null;
  document.getElementById('shW').textContent=cap(wd(date))+' '+fmtD(date)+(s.sl?' · '+(s.sl==='m'?'midi':'soir'):'');
  document.getElementById('shT').textContent=s.t;const zc=zcol(s);
  let h='<div class="nums" style="margin-top:0">'+['<div><b>'+hm(s.m)+'</b><span>durée</span></div>'].concat(s.km?['<div><b>'+km(s.km)+'</b><span>km env.</span></div>']:[],s.dp?['<div><b>'+fr(s.dp)+'</b><span>m D+</span></div>']:[]).join('')+'</div>';
  if(s.zt)h+='<div class="zbig" style="--zc:'+zc+'"><b>'+esc(s.zt.replace(/^Z\d\s*/,''))+'</b><span>zone '+esc(s.z[1])+(s.pc?' · allure '+esc(s.pc):'')+'</span></div>';
  const ds=cleanDs(s);if(ds)h+='<p class="ds">'+esc(ds)+'</p>';
  if(s.wo)h+='<ol class="steps">'+s.wo.map(b=>'<li><b>'+esc(b[0])+'</b><span>'+esc(b[1])+(b[2]?'<span class="zc" style="background:'+(ZC[b[2]]||'#888')+'">'+esc(b[2])+'</span>':'')+'</span>'+(b[3]?'<small>'+esc(b[3])+'</small>':'')+'</li>').join('')+'</ol>';
  const g=s.gk&&D.gym&&D.gym[s.gk];if(g)h+='<p class="ds">'+esc(g.intro)+'</p><ol class="exs">'+g.ex.map(e=>'<li><span>'+esc(e[0])+'</span><b>'+esc(e[1])+'</b></li>').join('')+'</ol>';
  if(s.r)h+='<div class="did2'+(VWARN[s.r.v]?' warn':'')+'"><b>Ce que j\'ai fait · '+esc(s.r.vt)+'</b>'+hm(s.r.min)+(s.r.km?' · '+km(s.r.km)+' km':'')+(s.r.dp?' · '+fr(s.r.dp)+' m D+':'')+(s.r.hr?' · FC moy. '+s.r.hr:'')+'<div class="muted" style="margin-top:4px;font-size:.88rem">'+esc(resText(s))+'</div></div>';
  else if(s.c!=='gym')h+='<span class="wx" data-wx="'+date+'|'+(s.sl||'')+'|'+s.m+'" style="font-size:.9rem"></span>';
  if(s.gk&&g&&typeof ANIM!=='undefined')h+='<button class="btn" data-gym="'+s.gk+'|'+date+'">▶ Démarrer la séance</button>';
  if(s.co&&!s.r)h+='<p class="note">⌚ Séance programmée par Dorian sur Nolio : elle est déjà sur ta Coros, lance-la depuis ta montre.</p>';
  if(OWNER&&!s.co&&(s.c==='run'||s.gk)&&!s.r){const dd=diff(T,date);
    if(s.cp)h+='<p class="note">⌚ Déjà sur ta Coros (envoyée pour le '+fmtD(s.cp).replace(/\.$/,'')+').</p>';
    else if(dd>=0&&dd<=90)h+='<a class="btn ghost" href="'+CARNET+'#coros='+encodeURIComponent(ws+'#'+i)+'" target="_blank" rel="noopener">⌚ Envoyer sur ma Coros</a><p class="note">S\'ouvre dans ton carnet, qui est connecté à ta montre.</p>'}
  if(s.k)h+='<p class="note">Séance clé de la semaine : c\'est celle à ne pas sauter.</p>';
  document.getElementById('shB').innerHTML=h;dlg.showModal?dlg.showModal():dlg.setAttribute('open','');wxFill(document.getElementById('shB'))}
document.getElementById('shX').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});dlg.addEventListener('close',()=>{if(lastFocus&&lastFocus.isConnected)lastFocus.focus()});
document.addEventListener('click',e=>{const g=e.target.closest('[data-gym]');if(g){const[k,d]=g.dataset.gym.split('|');dlg.close();startGym(k,d);return}const b=e.target.closest('[data-s]');if(b){const[ws,i]=b.dataset.s.split('|');openSess(ws,+i,b)}});

/* ---------- haut de page ---------- */
(()=>{const r=D.races.find(x=>diff(T,x.date)>=0);const el=document.getElementById('cd');if(r){const n=diff(T,r.date);el.innerHTML=esc(SH[r.id]||r.name)+' <b>'+(n?'J−'+n:'Jour J')+'</b>'}})();

/* ---------- aujourd'hui ---------- */
let selDay=T;
function vToday(){const el=document.getElementById('s-aujourdhui');const ws=monday(T);const days=[...Array(7)].map((_,i)=>add(ws,i));
  const L=dayS(selDay),isT=selDay===T,pre=selDay<D.planStart;
  let h='<div class="hd"><h1 id="h-auj">'+(isT?'Aujourd\'hui':cap(wd(selDay)))+'</h1><p>'+cap(wd(selDay))+' '+fmtD(selDay).replace(/\.$/,'')+(L.length?' · '+(L.length>1?L.length+' séances, ':'')+hm(L.reduce((a,s)=>a+s.m,0)):'')+'</p></div>';
  h+='<div class="strip" role="group" aria-label="Jours de la semaine">'+days.map(d=>{const S=dayS(d);return '<button data-day="'+d+'" class="'+(d===T?'today':'')+'" aria-pressed="'+(d===selDay)+'" aria-label="'+cap(wd(d))+' '+fmtD(d)+(S.length?', '+S.length+' séance'+(S.length>1?'s':''):', repos')+'"><span class="d">'+wd(d).slice(0,3)+'</span><span class="n">'+(+d.slice(8))+'</span><span class="dots">'+S.slice(0,3).map(s=>'<i style="background:'+zcol(s)+'"></i>').join('')+'</span></button>'}).join('')+'</div>';
  h+='<div class="sess" style="margin-top:14px">';
  if(L.length)h+=L.map(s=>sessCard(s,true)).join('');
  else h+='<div class="rest"><b>'+(pre?'Pré-saison libre':'Repos')+'</b>'+(pre?'Pas de programme avant le '+fmtD(D.planStart).replace(/\.$/,'')+' : footing au feeling, en aisance.':'Sommeil, hydratation, un peu de mobilité si besoin.')+'</div>';
  actsOn(selDay).forEach(a=>{h+='<div class="did"><span>✓ '+esc(a.name||KL[a.k]||'Séance')+'</span><b class="mono">'+(a.km?km(a.km)+' km · ':'')+hm(a.dur/60)+(a.dp?' · '+fr(a.dp)+' m':'')+'</b></div>'});
  h+='</div>';
  // prochaine séance si rien aujourd'hui
  if(!L.length){for(let i=1;i<=21;i++){const d=add(selDay,i),N=dayS(d);if(N.length){h+='<div class="sub"><span>Prochaine séance · '+wd(d)+' '+fmtD(d).replace(/\.$/,'')+'</span></div><div class="sess">'+N.map(s=>sessCard(s,false)).join('')+'</div>';break}}}
  // semaine
  const W=weekOf(ws);
  if(W&&W.min){const real=D.week&&D.week.ws===ws?D.weekReal:null;
    const g=(l,v,p,f)=>'<div class="ga"><div class="l"><span>'+l+'</span><b>'+(real?f(v)+' / ':'')+f(p)+'</b></div><div class="t"><i style="width:'+(real&&p?Math.min(100,v/p*100):0)+'%"></i></div></div>';
    h+='<div class="sub"><span>Ma semaine · '+esc(W.label)+'</span><a href="#/seances">Tout le plan</a></div><div class="box gauges">'+g('Temps',real?real.h*60:0,W.min,hm)+g('Distance',real?real.km:0,W.km,x=>km(Math.round(x))+' km')+g('Dénivelé',real?real.dp:0,W.dp,x=>fr(x)+' m')+(real?'':'<p class="note" style="margin:0">Prévu cette semaine. Le réalisé s\'affiche à la mise à jour du lundi.</p>')+'</div>';
    if(W.note)h+='<div class="wknote">'+esc(W.note)+'</div>'}
  else if(selDay<D.planStart){h+='<div class="sub"><span>La prépa démarre le '+fmtD(D.planStart).replace(/\.$/,'')+'</span><a href="#/seances">Voir le plan</a></div>'}
  // prochaine course
  const r=D.races.find(x=>diff(T,x.date)>=0);if(r){const n=diff(T,r.date);h+='<div class="sub"><span>Prochaine course</span></div><a class="box race1" href="#/plus/courses"><div><b>'+esc(r.name)+'</b><div class="muted" style="font-size:.86rem">'+fmtDY(r.date)+' · '+r.km+' km · '+fr(r.dp)+' m D+</div></div><span class="j"><small>J−</small>'+n+'</span></a>'}
  el.innerHTML=h;
  el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;vToday()});wxFill(el)}

/* ---------- séances (plan semaine par semaine) ---------- */
const PC={reprise:'#5B6B7A',fondation:'#2F7D5B',dev:'#3E7CB1',spe1:'#7A5BA6',spe2:'#C0392B',recup:'#6B7078',diag:'#B0443B',taper:'#A58D4E',post:'#45494F',pre:'#9AA0A8'};
let wIdx=Math.max(0,PL.findIndex(w=>{const k=diff(w.ws,T);return k>=0&&k<7}));
function vPlan(){const el=document.getElementById('s-seances');if(!PL.length){el.innerHTML='<p>Plan indisponible.</p>';return}
  const w=PL[wIdx],end=add(w.ws,6),cur=diff(w.ws,T)>=0&&diff(w.ws,T)<7;
  const phs=[];PL.forEach((x,i)=>{if(x.ph&&!phs.some(p=>p.ph===x.ph))phs.push({ph:x.ph,name:x.phase,i})});
  let h='<div class="hd"><h1>Séances</h1></div>';
  h+='<div class="wnav"><button id="wPrev" aria-label="Semaine précédente"'+(wIdx?'':' disabled')+'>‹</button><div class="c"><b>'+(cur?'Cette semaine':'Semaine du '+fmtD(w.ws).replace(/\.$/,''))+'</b><span>'+fmtD(w.ws)+' – '+fmtD(end)+' · '+esc(w.label)+'</span></div><button id="wNext" aria-label="Semaine suivante"'+(wIdx<PL.length-1?'':' disabled')+'>›</button></div>';
  if(w.min)h+='<div class="wsum"><span><b>'+hm(w.min)+'</b></span><span><b>'+fr(w.km)+'</b> km</span><span><b>'+fr(w.dp)+'</b> m D+</span></div>';
  h+='<div class="phase" role="group" aria-label="Phases">'+phs.map(p=>'<button data-ph="'+p.i+'" aria-pressed="'+(p.ph===w.ph)+'"><i style="background:'+(PC[p.ph]||'#888')+'"></i>'+esc(p.name)+'</button>').join('')+'</div>';
  if(!cur&&wIdx!==PL.findIndex(x=>{const k=diff(x.ws,T);return k>=0&&k<7}))h+='<button class="btn ghost" id="wToday" style="min-height:42px;margin-top:8px">Revenir à cette semaine</button>';
  h+='<div class="days">'+[...Array(7)].map((_,d)=>{const date=add(w.ws,d);const S=w.s.map((s,i)=>Object.assign({_i:i,_ws:w.ws},s)).filter(s=>s.d===d).sort((a,b)=>(SR[a.sl||'']??1)-(SR[b.sl||'']??1));
    return '<div class="day'+(date===T?' today':'')+'"><div class="dl">'+wd(date).slice(0,3)+'<b>'+(+date.slice(8))+'</b></div>'+(S.length?'<div class="sess">'+S.map(s=>sessCard(s,false)).join('')+'</div>':'<div class="none">'+(w.ws<D.planStart?'Au feeling':'Repos')+'</div>')+'</div>'}).join('')+'</div>';
  if(w.note)h+='<div class="wknote">'+esc(w.note)+'</div>';
  const ph=(D.phases||[]).find(p=>p.name===w.phase);if(ph&&ph.goal)h+='<p class="note"><b>'+esc(ph.name)+'</b> : '+esc(ph.goal)+'</p>';
  el.innerHTML=h;
  const go=i=>{wIdx=Math.max(0,Math.min(PL.length-1,i));vPlan();window.scrollTo(0,0)};
  el.querySelector('#wPrev').onclick=()=>go(wIdx-1);el.querySelector('#wNext').onclick=()=>go(wIdx+1);
  const wt=el.querySelector('#wToday');if(wt)wt.onclick=()=>go(Math.max(0,PL.findIndex(x=>{const k=diff(x.ws,T);return k>=0&&k<7})));
  el.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>go(+b.dataset.ph));
  const a=el.querySelector('.phase [aria-pressed=true]');if(a)a.parentElement.scrollLeft=a.offsetLeft-16;wxFill(el)}

/* ---------- assistance ---------- */
let LIVE=null,formOpen=false;
const AS=(()=>{const S=D.strat||{};const TZ={diag:4,rt100:2,mb42:2};const TZN={diag:'heure de la Réunion',rt100:'heure de Corse',mb42:'heure d\'Afrique du Sud'};

  const hhmm=ms=>clk(ms).slice(5);

  function giveHTML(a){if(!a||!a.on)return '';return '<ul>'+a.give.map(g=>'<li>'+esc(g)+'</li>').join('')+(a.solid?'<li>≈ '+a.solid+' g de solide (salé et sucré)</li>':'')+'</ul><div style="margin-top:6px;font-size:.86rem;opacity:.85">Remplir '+a.flasks.water+' flasque'+(a.flasks.water>1?'s':'')+' d\'eau'+(a.flasks.iso&&a.flasks.drink?' et '+a.flasks.iso+' de '+esc(a.flasks.drink):'')+'. De quoi tenir jusqu\'à '+esc(a.until)+' ('+a.dur+').</div>'}
  function draw(){const el=document.getElementById('s-assistance');const r=R.find(x=>x.id===cur),o=S[cur]||{};let MP=null,crewPlan=null;
    let h='<div class="hd"><h1>Assistance</h1><p>Où je suis, quand j\'arrive, et ce qu\'il faut me donner.</p></div>';
    h+='<div class="seg" role="group" aria-label="Course">'+R.map(x=>'<button data-as="'+x.id+'" aria-pressed="'+(x.id===cur)+'">'+esc(SH[x.id]||x.name)+'</button>').join('')+'</div>';
    const liveOn=LIVE&&LIVE.url&&/^https:\/\//.test(LIVE.url)&&(!LIVE.from||Date.parse(LIVE.from)<=Date.now())&&(!LIVE.until||Date.parse(LIVE.until)>Date.now());
    const CR=(D.crew||{})[cur]||{};const off=(LIVE&&LIVE.race===cur&&LIVE.official)||CR.live||(cur==='diag'?'https://www.grandraid-reunion.com/fr/suivi-courses-et-coureurs/':'');

    else{const st=startMs(r),rows=o.rows,P=getPass(cur),now=nowLocal(cur);
      let f=1,done=-1,lastAt=st,info='';

        info='Dernier passage : <b>'+esc(rows[P.i].nm)+'</b> à <b>'+hhmm(P.at)+'</b>. '+(pct>2?'Je vais '+pct+' % moins vite que prévu.':pct<-2?'Je vais '+(-pct)+' % plus vite que prévu.':'Je suis dans les temps.')}
      const eta=rows.map((x,i)=>{if(i<=done)return null;const dh=(x.th-(done>=0?rows[done].th:0))*f;const ms=lastAt+dh*36e5;const w=Math.max(10/60,dh*.12);return{ms,lo:ms-w*36e5,hi:ms+w*36e5,risk:(ms-st)/36e5>x.bh}});
      let nx=rows.findIndex((x,i)=>i>done&&eta[i].hi>now);if(nx<0&&now<st)nx=rows.findIndex((x,i)=>i>done);const A={};(o.assist||[]).forEach(a=>A[a.nm]=a);
      // position estimée : temps de plan écoulé -> km

      if(nx>=0){const x=rows[nx],e=eta[nx],left=(e.ms-now)/36e5,before=now<st&&!P,a=A[x.nm];

    try{const r=await fetch((window.VT_SRC||'')+'index.html?v='+Date.now(),{cache:'no-store'});if(r.ok){const m=(await r.text()).match(/name="vt-version" content="([0-9.]+)"/);
      if(m&&vcmp(m[1],APPV)>0){const b=document.createElement('div');b.id='upd';b.setAttribute('role','status');
        b.innerHTML='<span><b>Version '+vshort(m[1])+' disponible</b><small>Recharge pour l\'installer</small></span><button type="button">Mettre à jour</button>';
        b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)}}}catch(e){}busy=false;last=Date.now()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>5*60e3)chk()});
  setInterval(chk,30*60e3)})();
// suivi en direct
async function chkLive(){try{const r=await fetch('live.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const L=await r.json();LIVE=L;const now=Date.now();
  const ok=L&&L.url&&/^https:\/\//.test(L.url)&&(!L.from||Date.parse(L.from)<=now)&&(!L.until||Date.parse(L.until)>now);
  document.getElementById('livepill').classList.toggle('on',!!ok);if(ok)document.getElementById('liveT').textContent=(L.title||'En direct')+' · voir ma position';
  if(L&&L.race&&!chkLive.set){chkLive.set=1;AS.setRace(L.race)}
  if(document.getElementById('s-assistance').classList.contains('on'))AS.draw()}catch(e){document.getElementById('livepill').classList.remove('on')}}
chkLive();setInterval(chkLive,60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(document.getElementById('s-assistance').classList.contains('on')&&!document.activeElement.closest('#asForm'))AS.draw()},120000);
</script>

<script id="boot">
/* VictorTrail privé : données chiffrées (AES-GCM), clé récupérée après connexion Supabase (code e-mail), ou lien équipe (#k=…). */
(function(){
const SB='https://vvmfutlpcdgufuowcvte.supabase.co',PK='sb_publishable_5vrAEcRUk75_ucJlDecVxA__k8E9iwi';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=s=>b64(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));
async function dec(box,k){const key=await crypto.subtle.importKey('raw',b64u(k),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(box.iv)},key,b64(box.ct));
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
window.VT_dec=(box,w)=>dec(box,LS.get(w==='c'?'vt-kc':'vt-ko'));
window.VT_KC=()=>LS.get('vt-kc')||'';
window.VT_logout=()=>{LS.del('vt-ko');LS.del('vt-kc');LS.del('vt-email')};
// lien équipe : …#/assistance&k=CLE
const m=location.hash.match(/[#&]k=([A-Za-z0-9_-]{40,})/);
if(m){LS.set('vt-kc',m[1]);history.replaceState(null,'',location.pathname+location.search+'#/assistance')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function keysFrom(tok){const v=await api('/rest/v1/vault?select=k_owner,k_crew',null,tok);
  if(!v||!v[0])throw new Error('Aucune clé pour ce compte.');
  LS.set('vt-ko',v[0].k_owner);LS.set('vt-kc',v[0].k_crew);
  fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:PK,Authorization:'Bearer '+tok}}).catch(()=>{})}
async function verifyLink(txt){let th=null;try{const u=new URL(txt.trim());th=u.searchParams.get('token')||u.searchParams.get('token_hash')}catch(e){}
  if(!th)throw new Error('Lien non reconnu : copie le lien « Sign in » de l\'e-mail.');
  let s;try{s=await api('/auth/v1/verify',{type:'email',token_hash:th})}catch(e){s=await api('/auth/v1/verify',{type:'magiclink',token_hash:th})}
  return s.access_token}
const HP=new URLSearchParams(location.hash.replace(/^#/,''));let BACK=null;
if(HP.get('access_token')){BACK={tok:HP.get('access_token')};history.replaceState(null,'',location.pathname+location.search+'#/aujourdhui')}
else if(HP.get('error')){BACK={err:(HP.get('error_description')||'Lien invalide ou expiré.').replace(/\+/g,' ')};history.replaceState(null,'',location.pathname+location.search)}
async function run(){
  if(BACK&&BACK.tok){const t=BACK.tok;BACK=null;try{await keysFrom(t)}catch(e){return lock(e.message)}}
  if(BACK&&BACK.err){const m=BACK.err;BACK=null;return lock(/expired|invalid/i.test(m)?'Ce lien a expiré ou a déjà servi : demande-en un nouveau.':m)}
  const pack=JSON.parse(document.getElementById('enc').textContent||'{}');
  if(!pack.o)return lock('Données indisponibles pour le moment.');
  let D=null,owner=false;const ko=LS.get('vt-ko'),kc=LS.get('vt-kc');
  if(ko){try{D=await dec(pack.o,ko);owner=true}catch(e){LS.del('vt-ko')}}
  if(!D&&kc){try{D=await dec(pack.c,kc)}catch(e){LS.del('vt-kc')}}
  if(!D)return lock();
  window.VT_D=D;window.VT_OWNER=owner;
  const L=document.getElementById('lock');if(L)L.remove();
  if(D.crewMode){const t=document.querySelector('.tabs');if(t)t.classList.add('crew')}
  const el=document.createElement('script');el.textContent=document.getElementById('app').textContent;document.body.appendChild(el)}
async function api(path,body,tok){const r=await fetch(SB+path,{method:body?'POST':'GET',headers:Object.assign({apikey:PK,'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));return j}
function lock(msg){
  let L=document.getElementById('lock');if(!L){L=document.createElement('div');L.id='lock';document.body.appendChild(L)}
  const em=LS.get('vt-email')||'';
  L.innerHTML='<div class="card" role="dialog" aria-labelledby="lkT"><h1 id="lkT">VictorTrail est privé</h1><p>'+(msg?esc(msg)+' ':'')+'Connecte-toi : tu reçois un code à usage unique par e-mail.</p>'
   +'<form id="lkF1"><label for="lkMail">Adresse e-mail</label><input id="lkMail" type="email" autocomplete="email" inputmode="email" required value="'+esc(em)+'"><button class="btn" type="submit">Recevoir mon code</button></form>'
   +'<form id="lkF2" hidden><p>E-mail envoyé. Saisis le code qu\'il contient (ou colle le lien de connexion s\'il n\'y a pas de code).</p><label for="lkCode">Code reçu par e-mail</label><input id="lkCode" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required><button class="btn" type="submit">Ouvrir mon carnet</button><button class="btn ghost" type="button" id="lkBack" style="margin-top:8px">Changer d\'adresse</button></form>'
   +'<p class="err" id="lkE" role="alert"></p><p class="small">Tu fais partie de l\'équipe d\'assistance ? Ouvre le lien que Victor t\'a envoyé.</p></div>';
  const E=t=>{document.getElementById('lkE').textContent=t||''};let mail=LS.get('vt-email')||'';
  document.getElementById('lkF1').onsubmit=async ev=>{ev.preventDefault();E('');mail=document.getElementById('lkMail').value.trim().toLowerCase();const b=ev.target.querySelector('button');b.disabled=true;b.textContent='Envoi…';
    try{await api('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:mail,create_user:false});LS.set('vt-email',mail);document.getElementById('lkF1').hidden=true;document.getElementById('lkF2').hidden=false;document.getElementById('lkCode').focus();E('')}
    catch(e){E(/signup|not found|not allowed/i.test(e.message)?'Cette adresse n\'a pas accès.':'Envoi impossible : '+e.message)}b.disabled=false;b.textContent='Recevoir mon code'};
  document.getElementById('lkBack').onclick=()=>{document.getElementById('lkF2').hidden=true;document.getElementById('lkF1').hidden=false};
  document.getElementById('lkF2').onsubmit=async ev=>{ev.preventDefault();E('');const b=ev.target.querySelector('button');b.disabled=true;b.textContent='Vérification…';
    try{const val=document.getElementById('lkCode').value.trim();let tok;
      if(/^[0-9]{6,10}$/.test(val)){mail=mail||LS.get('vt-email')||'';tok=(await api('/auth/v1/verify',{type:'email',email:mail,token:val})).access_token}
      else tok=await verifyLink(val);
      await keysFrom(tok);run()}
    catch(e){E(/expired|invalid|otp/i.test(e.message)?'Code incorrect ou expiré.':e.message);b.disabled=false;b.textContent='Ouvrir mon carnet'}};
}
window.VT_run=run;
if(!window.VT_NOAUTO)run();
})();
</script>
